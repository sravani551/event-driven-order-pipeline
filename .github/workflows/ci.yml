name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    env:
      NOTIFICATION_FAIL_RATE: "0.3"       # exercise the retry path
      RETRY_DELAYS_MS: "1000,2000,4000"   # short delays so CI is fast
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: python3 scripts/e2e_check.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
